name: AI CI

# ============================================================
# 트리거 설정: PR이 생성/업데이트될 때 + 브랜치 푸시 시 자동 실행
# ============================================================
on:
  # PR 이벤트 (코드 검증용)
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - dev
      - main
    # AI 관련 파일이 변경될 때만 실행
    # paths:
    #   - 'app/**'
    #   - 'tests/**'
    #   - 'requirements.txt'
    #   - 'requirements-dev.txt'
    #   - 'Dockerfile'
    #   - '.dockerignore'
    #   - '.github/workflows/ai-ci.yml'

  # Push 이벤트 (CD 트리거용)
  push:
    branches:
      - dev
      - main
    # paths:
    #   - 'app/**'
    #   - 'tests/**'
    #   - 'requirements.txt'
    #   - 'requirements-dev.txt'
    #   - 'Dockerfile'
    #   - '.dockerignore'
    #   - '.github/workflows/ai-ci.yml'

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write  # OIDC를 위한 권한 추가

# ============================================================
# 동시성 제어: 같은 PR 또는 브랜치에서 새 실행 시 이전 실행 취소
# ============================================================
concurrency:
  group: ai-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ============================================================
# 환경 변수 설정
# ============================================================
env:
  PYTHON_VERSION: '3.11'

# ============================================================
# CI 작업 정의
# ============================================================
jobs:
  # ========================================================
  # Job 1: 테스트
  # ========================================================
  test-and-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # # 서비스 컨테이너 (테스트용 데이터베이스)
    # services:
    #   redis:
    #     image: redis:7.2
    #     ports:
    #       - 6380:6379
    #     options: >-
    #       --health-cmd="redis-cli ping"
    #       --health-interval=5s
    #       --health-timeout=3s
    #       --health-retries=5
    #   qdrant:
    #     image: qdrant/qdrant:v1.16.2
    #     ports:
    #       - 6333:6333

    # 환경 변수 설정 (테스트용)
    env:
      APP_ENV: ci
      DEBUG: False
      # REDIS_HOST: localhost
      # REDIS_PORT: 6380
      # REDIS_DB: 0
      # QDRANT_HOST: localhost
      # QDRANT_PORT: 6333
      # QDRANT_COLLECTION_NAME: clothes
      # QDRANT_SHOP_COLLECTION_NAME: commerce
      UPSTAGE_API_KEY: ${{ secrets.UPSTAGE_API_KEY }}

    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      commit_sha: ${{ steps.version.outputs.commit_sha }}

    # ========================================================
    # CI 단계 (Steps)
    # ========================================================
    steps:
      # ------------------------------------------------------
      # 1. 소스 코드 체크아웃
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. 버전 정보 추출
      # ------------------------------------------------------
      - name: Extract version info
        id: version
        run: |
          # Git 태그에서 최신 시맨틱 버전 가져오기
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          VERSION=${LATEST_TAG#v}

          # 커밋 SHA (short)
          COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)

          # 브랜치명
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH="${{ github.head_ref }}"
          else
            BRANCH="${{ github.ref_name }}"
          fi

          # 슬래시를 하이픈으로 치환
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/' '-')

          # 이미지 태그 생성: {branch}-{version}-{sha}
          # 예: dev-1.0.0-abc1234, main-1.0.0-abc1234
          IMAGE_TAG="${SAFE_BRANCH}-${VERSION}-${COMMIT_SHA}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

          echo "### Version Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${COMMIT_SHA}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${BRANCH}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${IMAGE_TAG}" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------
      # 3. Python 설정 및 캐싱
      # ------------------------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # ------------------------------------------------------
      # 4. 의존성 설치
      # ------------------------------------------------------
      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

          echo "### 📦 Installed Packages" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          pip list | grep -E "fastapi|uvicorn|gunicorn|qdrant|redis|boto3|httpx" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------
      # 5. 정적 분석 - Ruff Lint (PR만)
      # ------------------------------------------------------
      - name: Run Ruff lint
        if: github.event_name == 'pull_request'
        id: ruff_lint
        run: |
          echo "Running Ruff lint..."
          ruff check app/ tests/ --output-format=github
        continue-on-error: true

      # ------------------------------------------------------
      # 6. 코드 포맷 검사 - Ruff Format (PR만)
      # ------------------------------------------------------
      - name: Check code formatting
        if: github.event_name == 'pull_request'
        id: ruff_format
        run: |
          echo "Checking code format..."
          ruff format --check app/ tests/
        continue-on-error: true

      # ------------------------------------------------------
      # 7. 타입 체크 - MyPy (PR만)
      # ------------------------------------------------------
      - name: Run type Checking
        if: github.event_name == 'pull_request'
        id: mypy
        run: |
          echo "Running MyPy type check..."
          mypy app/ --ignore-missing-imports || true
          echo "### 📝 Type Check" >> $GITHUB_STEP_SUMMARY
          echo "MyPy 타입 체크 완료 (경고만 표시)" >> $GITHUB_STEP_SUMMARY
        continue-on-error: true

      # ------------------------------------------------------
      # 8. 테스트 실행 및 커버리지 측정 (PR만)
      # ------------------------------------------------------
      - name: Run tests with Coverage
        if: github.event_name == 'pull_request'
        id: test
        run: |
          echo "Running tests with coverage..."
          pytest tests/ \
            -v \
            --tb=short \
            --maxfail=5 \
            --cov=app \
            --cov-report=xml \
            --cov-report=term \
            --cov-report=html \
            --junitxml=test-results.xml
        continue-on-error: false

      # ------------------------------------------------------
      # 9. 테스트 커버리지 추출 (PR만)
      # ------------------------------------------------------
      - name: Extract test Coverage
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          if [ -f coverage.xml ]; then
            COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(int(float(root.attrib['line-rate']) * 100))")
          else
            COVERAGE="0"
          fi

          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "### 📊 Test Coverage: ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY

          if [ "$COVERAGE" -lt 70 ]; then
            echo "::warning::Test coverage is below 70% (${COVERAGE}%)"
          fi
        continue-on-error: true

      # ------------------------------------------------------
      # 10. 테스트 결과 발행 (PR만)
      # ------------------------------------------------------
      - name: Publish test results
        if: github.event_name == 'pull_request'
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: test-results.xml
          check_name: AI Test Results
          comment_mode: off

      # ------------------------------------------------------
      # 11. 테스트 리포트 업로드 (PR 실패 시)
      # ------------------------------------------------------
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-reports-${{ steps.version.outputs.commit_sha }}
          path: |
            htmlcov/
            coverage.xml
            test-results.xml
          retention-days: 7

      # ------------------------------------------------------
      # 12. 애플리케이션 임포트 테스트 (PR만)
      # ------------------------------------------------------
      - name: Test application import
        if: github.event_name == 'pull_request'
        id: import_test
        run: |
          echo "Testing application import..."
          python -c "from app.main import app; print('✅ Application import successful')"
        continue-on-error: false

      # ------------------------------------------------------
      # 13. PR에 결과 코멘트 작성 (PR만)
      # ------------------------------------------------------
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.coverage }}' || 'N/A';
            const ruffLint = '${{ steps.ruff_lint.outcome }}';
            const ruffFormat = '${{ steps.ruff_format.outcome }}';
            const test = '${{ steps.test.outcome }}';
            const importTest = '${{ steps.import_test.outcome }}';
            const version = '${{ steps.version.outputs.version }}';
            const imageTag = '${{ steps.version.outputs.image_tag }}';

            const getIcon = (status) => status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';

            const getCoverageColor = (cov) => {
              const num = parseInt(cov);
              if (num >= 80) return '🟢';
              if (num >= 70) return '🟡';
              return '🔴';
            };

            const body = `## 🤖 AI Service CI Results

            | Check | Status | Details |
            |-------|--------|---------|
            | 🔍 Code Lint | ${getIcon(ruffLint)} ${ruffLint} | Ruff 린트 검사 |
            | 🎨 Code Format | ${getIcon(ruffFormat)} ${ruffFormat} | Ruff 포맷 검사 |
            | 🧪 Tests | ${getIcon(test)} ${test} | 단위 테스트 |
            | 📦 Import Test | ${getIcon(importTest)} ${importTest} | 앱 임포트 검증 |
            | 📊 Coverage | ${getCoverageColor(coverage)} ${coverage}% | 테스트 커버리지 |

            ### 📦 Build Information
            - **Version:** \`${version}\`
            - **Image Tag:** \`${imageTag}\`
            - **Branch:** \`${{ github.head_ref }}\` → \`${{ github.base_ref }}\`
            - **Commit:** \`${context.payload.pull_request.head.sha.substring(0, 7)}\`
            - **Author:** @${{ github.event.pull_request.user.login }}

            <details>
            <summary>📋 상세 정보</summary>

            ### 📊 테스트 커버리지 기준
            - 🟢 80% 이상: 우수
            - 🟡 70-79%: 양호
            - 🔴 70% 미만: 개선 필요

            [📊 전체 리포트 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            </details>

            ${coverage < 70 ? '\n⚠️ **주의:** 테스트 커버리지가 기준(70%)에 미달합니다.' : ''}
            ${test === 'failure' ? '\n❌ **테스트 실패:** 실패한 테스트를 확인해주세요.' : ''}
            `;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('AI Service CI Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ========================================================
  # Job 2: Docker 빌드 검증 (PR만)
  # ========================================================
  docker-validate:
    name: Docker Build Validation
    needs: test-and-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ------------------------------------------------------
      # 1. 소스 코드 체크아웃
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Dockerfile 문법 검사
      # ------------------------------------------------------
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      # ------------------------------------------------------
      # 3. Docker Buildx 설정
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # 4. Docker 빌드 테스트
      # ------------------------------------------------------
      - name: Build Docker image (validation only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: test:${{ needs.test-and-build.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.test-and-build.outputs.version }}

      # ------------------------------------------------------
      # 5. 검증 결과 요약
      # ------------------------------------------------------
      - name: Docker validation success
        run: |
          echo "### ✅ Docker Build Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "Dockerfile이 정상적으로 빌드됩니다." >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`test:${{ needs.test-and-build.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------
      # 6. PR 코멘트
      # ------------------------------------------------------
      - name: Comment Docker validation result
        uses: actions/github-script@v7
        with:
          script: |
            const body = `### 🐳 Docker Build Validation

            ✅ Dockerfile 빌드 검증 완료
            - **Image Tag:** \`test:${{ needs.test-and-build.outputs.image_tag }}\`
            - Hadolint 검사 통과
            - Docker 이미지 빌드 성공

            머지 후 ECR에 푸시됩니다.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # ========================================================
  # Job 3: Docker 빌드 및 ECR 푸시 (Push 이벤트만)
  # ========================================================
  deploy:
    name: Deploy to ECR
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # OIDC를 위한 permissions 설정
    permissions:
      id-token: write
      contents: read

    steps:
      # ------------------------------------------------------
      # 1. 소스 코드 체크아웃
      # ------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. AWS OIDC 인증
      # ------------------------------------------------------
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      # ------------------------------------------------------
      # 3. ECR 로그인
      # ------------------------------------------------------
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ------------------------------------------------------
      # 4. Docker 메타데이터 추출
      # ------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        run: |
          ECR_REGISTRY=${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG=${{ needs.test-and-build.outputs.image_tag }}
          BRANCH=${{ github.ref_name }}

          # 전체 이미지 URI
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          LATEST_TAG="${ECR_REGISTRY}/${ECR_REPOSITORY}:${BRANCH}-latest"

          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "ecr_registry=${ECR_REGISTRY}" >> $GITHUB_OUTPUT
          echo "ecr_repository=${ECR_REPOSITORY}" >> $GITHUB_OUTPUT

          echo "### 🐳 Docker Image Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Image URI:** \`${IMAGE_URI}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest Tag:** \`${LATEST_TAG}\`" >> $GITHUB_STEP_SUMMARY

      # ------------------------------------------------------
      # 5. Docker Buildx 설정
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # 6. Docker 이미지 빌드 및 푸시
      # ------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_uri }}
            ${{ steps.meta.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VERSION=${{ needs.test-and-build.outputs.version }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      # ------------------------------------------------------
      # 7. 이미지 취약점 스캔 (Trivy)
      # ------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      # ------------------------------------------------------
      # 8. Docker 메타데이터 저장 (CD에서 사용)
      # ------------------------------------------------------
      - name: Save Docker metadata
        run: |
          mkdir -p build-info
          cat > build-info/docker-metadata.json <<EOF
          {
            "imageUri": "${{ steps.meta.outputs.image_uri }}",
            "latestTag": "${{ steps.meta.outputs.latest_tag }}",
            "ecrRegistry": "${{ steps.meta.outputs.ecr_registry }}",
            "ecrRepository": "${{ steps.meta.outputs.ecr_repository }}",
            "imageTag": "${{ needs.test-and-build.outputs.image_tag }}",
            "version": "${{ needs.test-and-build.outputs.version }}",
            "branch": "${{ github.ref_name }}",
            "commitSha": "${{ github.sha }}",
            "buildTime": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "author": "${{ github.actor }}",
            "coverage": "${{ needs.test-and-build.outputs.coverage }}"
          }
          EOF
          cat build-info/docker-metadata.json

      # ------------------------------------------------------
      # 9. Docker 메타데이터 업로드
      # ------------------------------------------------------
      - name: Upload Docker metadata
        uses: actions/upload-artifact@v4
        with:
          name: docker-metadata-${{ github.ref_name }}-${{ github.sha }}
          path: build-info/docker-metadata.json
          retention-days: 90

      # ------------------------------------------------------
      # 10. Discord 알림 - 성공
      # ------------------------------------------------------
      - name: Send Discord notification on success
        if: success()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "AI CI/CD Bot"
          embed-title: "✅ AI Docker 이미지 ECR 푸시 성공"
          embed-description: |
            **브랜치:** `${{ github.ref_name }}`
            **버전:** `${{ needs.test-and-build.outputs.version }}`
            **이미지 태그:** `${{ needs.test-and-build.outputs.image_tag }}`

            **ECR URI:**
            ```
            ${{ steps.meta.outputs.image_uri }}
            ```

            CD 파이프라인에서 위 이미지를 사용하여 배포할 수 있습니다. 🚀

            [🔗 Actions 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          embed-color: 3066993
          embed-footer-text: ${{ github.repository }}

      # ------------------------------------------------------
      # 11. Discord 알림 - 실패
      # ------------------------------------------------------
      - name: Send Discord notification on failure
        if: failure()
        uses: tsickert/discord-webhook@v5.3.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          username: "AI CI/CD Bot"
          embed-title: "❌ AI Docker 이미지 ECR 푸시 실패"
          embed-description: |
            **브랜치:** `${{ github.ref_name }}`
            **커밋:** `${{ github.sha }}`

            Docker 빌드 또는 ECR 푸시 중 오류가 발생했습니다.

            [🔗 Actions 로그 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          embed-color: 15158332
          embed-footer-text: ${{ github.repository }}
